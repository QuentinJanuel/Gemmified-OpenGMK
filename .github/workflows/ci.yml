name: CI

# Every push to master and every PR is checked and built. A `v<version>` tag also releases the
# plugin: the zip goes to https://gemmified-opengmk.dappermink.me/<version>/opengmk-<version>.zip,
# the SoundFont goes next to it (the manifest's asset `url` points there), the feed icon goes to the
# bucket root, and latest.json is then replaced to list only that version
# (scripts/publish-feed.mjs). Last, the earlier versions' objects are deleted
# (scripts/prune-old-versions.mjs).
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1.77 is rust-toolchain.toml's channel; the nightly is only for rustfmt's unstable options.
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.77 --profile minimal --component clippy --target wasm32-unknown-unknown --target wasm32-wasi --no-self-update
          rustup toolchain install nightly-2026-08-22 --profile minimal --component rustfmt --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The CLI must match the wasm-bindgen version Cargo.lock pins exactly.
      - name: Install wasm-bindgen-cli
        run: |
          name=wasm-bindgen-0.2.114-x86_64-unknown-linux-musl
          curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.114/$name.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run package

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            plugin/
            dist/GeneralUser-GS.sf2
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Release the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'require("./package.json").version')" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          (cd plugin && zip -qr "../opengmk-$version.zip" .)
          pnpm dlx wrangler@4.120.0 r2 object put "gemmified-opengmk/$version/opengmk-$version.zip" \
            --file "opengmk-$version.zip" --content-type application/zip --remote
          pnpm dlx wrangler@4.120.0 r2 object put "gemmified-opengmk/$version/GeneralUser-GS.sf2" \
            --file dist/GeneralUser-GS.sf2 --content-type application/octet-stream --remote
          pnpm dlx wrangler@4.120.0 r2 object put gemmified-opengmk/icon.png \
            --file assets/logo/icon-128.png --content-type image/png --remote
          node scripts/publish-feed.mjs gemmified-opengmk https://gemmified-opengmk.dappermink.me "opengmk-$version.zip" \
            --icon https://gemmified-opengmk.dappermink.me/icon.png
          gh release create "$GITHUB_REF_NAME" "opengmk-$version.zip" dist/GeneralUser-GS.sf2 \
            --title "$GITHUB_REF_NAME" --notes ""

      - name: Delete the superseded builds
        run: node scripts/prune-old-versions.mjs gemmified-opengmk "${GITHUB_REF_NAME#v}"
